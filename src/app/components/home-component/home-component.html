<h1>Home Component</h1>

@if (alumnoDelt) {
    <app-delete-alumno-component [alumno]="alumnoDelt" (borrarAlumno)="borrarAlumno($event)"/>
}

@if (listaAlumnos) {
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Imagen</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            @for (alumno of listaAlumnos; track alumno) {
                <tr>
                    <td>{{alumno.nombre}}</td>
                    <td>{{alumno.apellidos}}</td>
                    <td><img src="{{alumno.imagen}}" alt="" style="height: 250px; width: 250px;"></td>
                    <td><button (click)="preguntaBorrarAlumno(alumno)">Delete</button></td>
                </tr>
            }
        </tbody>
    </table>
}
